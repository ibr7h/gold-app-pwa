name: Build full Gold App web

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-full-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gold-full /tmp/gold-app
          mkdir -p /tmp/gold-full
          unzip -q "gold-app 17 apr 15-19 adimin icon.zip" -d /tmp/gold-full
          mv "/tmp/gold-full/gold-app 17 apr 15-19 adimin icon" /tmp/gold-app
          SRC="/tmp/gold-app"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Prepare web-specific Metro config
        shell: bash
        run: |
          cd "$SRC"
          cat > metro.config.js <<'EOF'
          const { getDefaultConfig } = require("expo/metro-config");
          const { withNativeWind } = require("nativewind/metro");

          const config = getDefaultConfig(__dirname);

          module.exports = withNativeWind(config, {
            input: "./global.css",
          });
          EOF

      - name: Install dependencies
        shell: bash
        run: |
          cd "$SRC"
          pnpm install --frozen-lockfile

      - name: Type check
        continue-on-error: true
        shell: bash
        run: |
          cd "$SRC"
          pnpm check

      - name: Export web
        shell: bash
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_APP_VARIANT: "user"
        run: |
          cd "$SRC"
          rm -rf .expo node_modules/.cache
          pnpm exec expo export --platform web --output-dir dist-pwa --clear

      - name: Inspect export
        shell: bash
        run: |
          cd "$SRC"
          echo "===== DIST ====="
          find dist-pwa -maxdepth 3 -type f | sort | head -300
          echo "===== SIZE ====="
          du -sh dist-pwa
