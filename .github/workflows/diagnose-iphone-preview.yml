name: Verify live iPhone preview after Render fix
on:
  push:
    branches: ["feat/user-iphone-stable-viewport-20261009"]
    paths: [".github/workflows/diagnose-iphone-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check Safari manifest and app entrypoint on public Render site
        shell: bash
        run: |
          set -euo pipefail
          origin=https://dhahabi-user-iphone-preview.onrender.com
          base=$origin/gold-app-pwa/full
          curl -fsSL --max-time 30 -D /tmp/manifest-headers -o /tmp/manifest "$base/manifest.json?check=${GITHUB_SHA:0:8}"
          cat /tmp/manifest-headers | grep -iE '^HTTP/|^content-type:'
          grep -Eiq '^content-type: application/json' /tmp/manifest-headers
          python3 -m json.tool /tmp/manifest >/dev/null
          curl -fsSL --max-time 30 -o /tmp/page "$base/?check=${GITHUB_SHA:0:8}"
          grep -Fq '/gold-app-pwa/full/manifest.json' /tmp/page
          grep -Fq '/gold-app-pwa/full/_expo/static/js/web/' /tmp/page
          printf 'PASS: Render returned JSON PWA manifest and web entrypoint HTML\n'
