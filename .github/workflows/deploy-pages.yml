                <Text style={s.label}>كلمة المرور</Text>
                <TextInput style={s.input} value={password} onChangeText={setPassword} secureTextEntry autoComplete="password" placeholder="••••••••" />

                {!!(localError||error) && <Text style={s.error}>{localError||error}</Text>}

                <TouchableOpacity style={s.primary} onPress={submit} disabled={isLoading}>
                  {isLoading?<ActivityIndicator color="#001F3F"/>:<Text style={s.primaryText}>تسجيل الدخول</Text>}
                </TouchableOpacity>

                <TouchableOpacity style={s.linkBtn} onPress={()=>router.push('/register')}>
                  <Text style={s.link}>إنشاء حساب جديد</Text>
                </TouchableOpacity>

              </View>

              <Text style={s.note}>الحسابات الجديدة تُنشأ بصلاحية مستخدم. صلاحية التاجر أو المدير تُمنح من الإدارة.</Text>
            </ScrollView></SafeAreaView></View>
          }

          const s=StyleSheet.create({
            screen:{flex:1,backgroundColor:'#001F3F'},safe:{flex:1},wrap:{flexGrow:1,justifyContent:'center',padding:24,maxWidth:480,width:'100%',alignSelf:'center'},
            logo:{width:80,height:80,borderRadius:40,backgroundColor:'#C5A021',alignItems:'center',justifyContent:'center',alignSelf:'center',marginBottom:14},
            logoText:{fontSize:36,fontWeight:'800',color:'#001F3F'},title:{fontSize:30,fontWeight:'800',color:'#C5A021',textAlign:'center'},
            sub:{fontSize:14,color:'#F8F9FA',opacity:.75,textAlign:'center',marginTop:4,marginBottom:28},
            card:{backgroundColor:'#F8F9FA',borderRadius:18,padding:22},label:{fontSize:13,fontWeight:'700',color:'#1A1A1B',marginBottom:7,textAlign:'right'},
            input:{backgroundColor:'#fff',borderWidth:1,borderColor:'#D9DDE2',borderRadius:12,paddingHorizontal:14,paddingVertical:13,fontSize:15,marginBottom:14,textAlign:'right'},
            help:{fontSize:11,color:'#6C737F',textAlign:'right',marginTop:-6,marginBottom:14},error:{color:'#DC2626',fontSize:12,textAlign:'right',marginBottom:12},
            primary:{backgroundColor:'#C5A021',padding:14,borderRadius:12,alignItems:'center',marginTop:2},primaryText:{fontWeight:'800',color:'#001F3F',fontSize:15},
            linkBtn:{padding:10,alignItems:'center'},link:{color:'#8B6B00',fontWeight:'700'},muted:{color:'#6C737F',fontSize:12},
            note:{color:'#F8F9FA',opacity:.65,fontSize:11,textAlign:'center',lineHeight:18,marginTop:18}
          });
          EOF

          cat > app/register.web.tsx <<'EOF'
          import React,{useEffect,useState} from 'react';
          import {View,Text,StyleSheet,TextInput,TouchableOpacity,ActivityIndicator,ScrollView} from 'react-native';
          import {SafeAreaView} from 'react-native-safe-area-context';
          import {router} from 'expo-router';
          import {useAuth} from '@/contexts/AuthContext';

          export default function RegisterWeb(){
            const {startRegistration,isLoading,error,isLoggedIn,clearError}=useAuth();
            const [name,setName]=useState('');
            const [email,setEmail]=useState('');
            const [password,setPassword]=useState('');
