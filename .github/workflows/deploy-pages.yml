name: Deploy Gold App PWA to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "prices-live.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare existing stable root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/icons
          for f in index.html styles.css app.js manifest.webmanifest sw.js version.json .nojekyll prices-live.json; do
            [ -f "$f" ] && cp "$f" "_site/$f"
          done
          [ -d icons ] && cp -R icons/. _site/icons/

      - name: Extract full Gold App source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gold-full /tmp/gold-app
          mkdir -p /tmp/gold-full
          unzip -q "gold-app 17 apr 15-19 adimin icon.zip" -d /tmp/gold-full
          mv "/tmp/gold-full/gold-app 17 apr 15-19 adimin icon" /tmp/gold-app
          echo "SRC=/tmp/gold-app" >> "$GITHUB_ENV"

      - name: Apply web-only PWA compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"

          cat > metro.config.js <<'EOF'
          const { getDefaultConfig } = require("expo/metro-config");
          const { withNativeWind } = require("nativewind/metro");

          const config = getDefaultConfig(__dirname);

          module.exports = withNativeWind(config, {
            input: "./global.css",
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path("app.config.ts")
          s=p.read_text()
          marker='experiments: {'
          if marker in s and 'baseUrl:' not in s:
              s=s.replace(marker, 'experiments: {\n    baseUrl: "/gold-app-pwa/full",', 1)
          p.write_text(s)
          PY

          cat > contexts/AuthContext.web.tsx <<'EOF'
          import React, { createContext, useContext, useEffect, useMemo, useState } from 'react';
          import AsyncStorage from '@react-native-async-storage/async-storage';

          export type UserRole = 'user' | 'admin' | 'trader';
          export type BiometricType = 'face' | 'fingerprint' | 'none';
          export type ResetStep = 'email' | 'code' | 'newPassword' | 'success';
          export type RegisterStep = 'form' | 'verify' | 'success';

          export interface User {
            id?: string | number;
            openId?: string;
            email: string;
            role: UserRole;
            name?: string;
          }

          interface AuthContextType {
            user: User | null;
            isLoggedIn: boolean;
            isLoading: boolean;
            error: string | null;
            login: (email: string, password: string) => Promise<void>;
            logout: () => void;
            clearError: () => void;
            biometricType: BiometricType;
            biometricAvailable: boolean;
            biometricEnrolled: boolean;
            biometricEnabled: boolean;
            enableBiometric: () => Promise<void>;
            disableBiometric: () => Promise<void>;
            loginWithBiometric: () => Promise<boolean>;
            checkBiometricAvailability: () => Promise<void>;
            resetStep: ResetStep;
            resetEmail: string;
            resetCode: string;
            sendResetCode: (email: string) => Promise<boolean>;
            verifyResetCode: (code: string) => Promise<boolean>;
            resetPassword: (newPassword: string) => Promise<boolean>;
            resendResetCode: () => Promise<boolean>;
            cancelReset: () => void;
            registerStep: RegisterStep;
            registerEmail: string;
            registerCode: string;
            startRegistration: (name: string, email: string, password: string) => Promise<boolean>;
            verifyRegistration: (code: string) => Promise<boolean>;
            resendRegisterCode: () => Promise<boolean>;
            cancelRegistration: () => void;
            updateName: (newName: string) => Promise<boolean>;
            changePassword: (currentPassword: string, newPassword: string) => Promise<boolean>;
          }

          const AuthContext=createContext<AuthContextType|null>(null);
          const ACCESS='dhahabi_access_token';
          const REFRESH='dhahabi_refresh_token';
          const USER='dhahabi_user';
          const PROD_API='https://gold-app-api-u8dl.onrender.com';

          function getApiBase(){
            return PROD_API;
          }

          async function request(path:string, options:RequestInit={}, token?:string){
            const base=getApiBase();
            if(!base) throw new Error('api_url_required');
            const headers:Record<string,string>={'Content-Type':'application/json',...((options.headers as Record<string,string>)||{})};
            if(token) headers.Authorization='Bearer '+token;
            const r=await fetch(base+path,{...options,headers});
            const d=await r.json().catch(()=>({}));
            if(!r.ok){
              const msg=Array.isArray(d?.message)?d.message.join('، '):(d?.message||'request_failed');
              throw new Error(msg);
            }
            return d;
          }

          function mapRole(role:string):UserRole{
            if(role==='admin') return 'admin';
            if(role==='merchant') return 'trader';
            return 'user';
          }

          async function storeSession(tokens:any){
            await AsyncStorage.setItem(ACCESS,tokens.accessToken||'');
            await AsyncStorage.setItem(REFRESH,tokens.refreshToken||'');
          }

          export function AuthProvider({children}:{children:React.ReactNode}){
            const [user,setUser]=useState<User|null>(null);
            const [isLoading,setIsLoading]=useState(true);
            const [error,setError]=useState<string|null>(null);

            const loadMe=async(token?:string)=>{
              const access=token||await AsyncStorage.getItem(ACCESS)||'';
              if(!access) return null;
              try{
                const me=await request('/auth/me',{},access);
                const u:User={id:me.userId,email:me.email||'',role:mapRole(me.role||'user')};
                await AsyncStorage.setItem(USER,JSON.stringify(u));
                setUser(u);
                return u;
              }catch{
                return null;
              }
            };

            useEffect(()=>{
              (async()=>{
                try{
                  const cached=await AsyncStorage.getItem(USER);
                  if(cached) setUser(JSON.parse(cached));
                  const access=await AsyncStorage.getItem(ACCESS);
                  if(access) await loadMe(access);
                }finally{setIsLoading(false)}
              })();
            },[]);

            const login=async(email:string,password:string)=>{
              setIsLoading(true);setError(null);
              try{
                const tokens=await request('/auth/login',{method:'POST',body:JSON.stringify({email:email.trim(),password})});
                await storeSession(tokens);
                const me=await loadMe(tokens.accessToken);
                if(!me) throw new Error('login_failed');
              }catch(e:any){
                setError(e?.message||'login_failed');
                throw e;
              }finally{setIsLoading(false)}
            };

            const logout=()=>{
              Promise.all([AsyncStorage.removeItem(ACCESS),AsyncStorage.removeItem(REFRESH),AsyncStorage.removeItem(USER)]);
              setUser(null);setError(null);
            };

            const startRegistration=async(name:string,email:string,password:string)=>{
              setIsLoading(true);setError(null);
              try{
                const tokens=await request('/auth/register',{method:'POST',body:JSON.stringify({email:email.trim(),password,fullName:name.trim()||undefined})});
                await storeSession(tokens);
                await loadMe(tokens.accessToken);
                return true;
              }catch(e:any){
                setError(e?.message||'registration_failed');
                return false;
              }finally{setIsLoading(false)}
            };

            const updateName=async(newName:string)=>{
              if(!user) return false;
              const next={...user,name:newName};
              setUser(next);await AsyncStorage.setItem(USER,JSON.stringify(next));return true;
            };

            const noopTrue=async()=>true;
            const noopFalse=async()=>false;
            const value=useMemo<AuthContextType>(()=>({
              user,isLoggedIn:!!user,isLoading,error,login,logout,clearError:()=>setError(null),
              biometricType:'none',biometricAvailable:false,biometricEnrolled:false,biometricEnabled:false,
              enableBiometric:noopFalse as any,disableBiometric:noopFalse as any,loginWithBiometric:noopFalse,
              checkBiometricAvailability:async()=>{},
              resetStep:'email',resetEmail:'',resetCode:'',
              sendResetCode:noopFalse,verifyResetCode:noopFalse,resetPassword:noopFalse,resendResetCode:noopFalse,cancelReset:()=>{},
              registerStep:'form',registerEmail:'',registerCode:'',
              startRegistration,verifyRegistration:noopTrue,resendRegisterCode:noopTrue,cancelRegistration:()=>{},
              updateName,changePassword:noopFalse,
            }),[user,isLoading,error]);

            return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
          }

          export function useAuth(){
            const ctx=useContext(AuthContext);
            if(!ctx) throw new Error('useAuth must be used within AuthProvider');
            return ctx;
          }
          EOF

          cat > app/login.web.tsx <<'EOF'
          import React,{useEffect,useState} from 'react';
          import {View,Text,StyleSheet,TextInput,TouchableOpacity,ActivityIndicator,ScrollView} from 'react-native';
          import {SafeAreaView} from 'react-native-safe-area-context';
