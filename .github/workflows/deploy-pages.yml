          import AsyncStorage from '@react-native-async-storage/async-storage';
          import {useAuth} from '@/contexts/AuthContext';

          export default function LoginWeb(){
            const {login,isLoading,error,isLoggedIn,clearError}=useAuth();
            const [email,setEmail]=useState('');
            const [password,setPassword]=useState('');
            const [localError,setLocalError]=useState('');

            useEffect(()=>{if(isLoggedIn) router.replace('/');},[isLoggedIn]);

            const submit=async()=>{
              clearError();setLocalError('');
              try{await login(email,password)}catch{}
            };

            return <View style={s.screen}><SafeAreaView style={s.safe}><ScrollView contentContainerStyle={s.wrap}>
              <View style={s.logo}><Text style={s.logoText}>ذ</Text></View>
              <Text style={s.title}>ذهبي</Text>
              <Text style={s.sub}>تسجيل الدخول إلى حسابك</Text>

              <View style={s.card}>
                <Text style={s.label}>البريد الإلكتروني</Text>
