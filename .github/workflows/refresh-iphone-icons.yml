name: Refresh iPhone User icons
on:
  push:
    branches: ["preview/iphone-render"]
    paths:
      - "scripts/refresh-iphone-icons.py"
      - ".github/workflows/refresh-iphone-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/refresh-iphone-icons.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/user/assets apps/user/scripts/generate-icon.cjs apps/user/README.md _render_preview/gold-app-pwa/full
          if ! git diff --cached --quiet; then
            git commit -m "fix(user-iphone): replace all old icon artwork with new storefront logo"
            git push origin HEAD:preview/iphone-render
          fi
