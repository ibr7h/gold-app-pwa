name: Verify iPhone EUR reference display
on:
  pull_request:
    branches: ["preview/iphone-render"]
    paths:
      - "apps/user/overrides/web/euro-reference.ts"
      - "apps/user/overrides/web/euro-spot.ts"
      - "apps/user/overrides/web/tests/euro-spot.test.ts"
      - "apps/user/overrides/web/tests/euro-loader.test.ts"
      - "apps/user/overrides/web/display-currency.ts"
      - "apps/user/overrides/web/amount-words-localized.ts"
      - "apps/user/overrides/web/arabic-amount-words.ts"
      - "apps/user/overrides/web/UserWorkspace.tsx"
      - "apps/user/overrides/web/tests/euro-reference.test.ts"
      - ".github/workflows/verify-iphone-eur.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated User source
        run: |
          unzip -q "gold-app 17 apr 15-19 adimin icon.zip" -d /tmp
          echo "SRC=/tmp/gold-app 17 apr 15-19 adimin icon" >> "$GITHUB_ENV"
      - name: Verify Frankfurter EUR reference API and browser accessibility
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const now=new Date();
          const date=offset=>new Date(now.getTime()+offset*86400000).toISOString().slice(0,10);
          const url='https://api.frankfurter.dev/v1/'+date(-15)+'..'+date(0)+'?base=USD&symbols=EUR';
          const response=await fetch(url,{signal:AbortSignal.timeout(20000),headers:{Origin:'https://ibr7h.github.io'}});
          assert.equal(response.status,200,'EUR reference endpoint unavailable');
          const json=await response.json();
          assert(json.rates && Object.keys(json.rates).length>=3,'Missing dated FX observations');
          assert(Object.values(json.rates).some(r=>typeof r.EUR==='number'&&r.EUR>.3&&r.EUR<1.5));
          const cors=response.headers.get('access-control-allow-origin');
          assert(cors==='*'||cors==='https://ibr7h.github.io','Browser CORS header is missing');
          console.log('Verified dated USD/EUR ECB reference series and cross-origin fetch.');
          NODE
      - name: Verify direct XAU/EUR quote and app-domain browser access
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://app.dhahabk.com';
          const response=await fetch('https://api.gold-api.com/price/XAU/EUR',{
            credentials:'omit',redirect:'error',signal:AbortSignal.timeout(15000),headers:{Origin:origin,Accept:'application/json'}
          });
          assert.equal(response.status,200,'Direct EUR gold endpoint unavailable');
          const data=await response.json();
          assert.equal(data.symbol,'XAU');assert.equal(data.currency,'EUR');
          assert(typeof data.price==='number'&&Number.isFinite(data.price)&&data.price>0);
          assert(typeof data.exchangeRate==='number'&&data.exchangeRate>0&&data.exchangeRate<10);
          assert(Number.isFinite(Date.parse(data.updatedAt)),'Observation timestamp missing');
          const cors=response.headers.get('access-control-allow-origin');
          assert(cors==='*'||cors===origin,'Direct EUR browser CORS header is missing');
          console.log('Verified direct public XAU/EUR quote and CORS for app.dhahabk.com.');
          NODE
      - name: Check EUR conversions and purchase safety
        run: |
          cp -R apps/user/overrides/. "$SRC/"
          cd "$SRC"
          pnpm install --frozen-lockfile
          pnpm exec vitest run web/tests/euro-reference.test.ts web/tests/euro-loader.test.ts web/tests/euro-spot.test.ts web/tests/display-currency.test.ts web/tests/arabic-amount-words.test.ts
          pnpm exec tsc --noEmit
