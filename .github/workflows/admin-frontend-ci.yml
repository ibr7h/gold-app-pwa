name: Admin Frontend Checks

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test apps/admin/tests/*.test.mjs
