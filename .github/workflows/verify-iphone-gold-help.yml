name: Verify iPhone gold knowledge guide
on:
  pull_request:
    branches: ["preview/iphone-render"]
    paths:
      - "apps/user/overrides/web/GoldHelp.tsx"
      - "apps/user/overrides/web/gold-help-content.ts"
      - "apps/user/overrides/web/gold-help.css"
      - "apps/user/overrides/web/UserWorkspace.tsx"
      - "apps/user/overrides/web/i18n-messages.ts"
      - "apps/user/overrides/web/tests/gold-help.test.ts"
      - ".github/workflows/verify-iphone-gold-help.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract only User application sources
        run: |
          unzip -q "gold-app 17 apr 15-19 adimin icon.zip" -d /tmp
          echo "SRC=/tmp/gold-app 17 apr 15-19 adimin icon" >> "$GITHUB_ENV"
      - name: Install and exercise the gold literacy center
        run: |
          cp -R apps/user/overrides/. "$SRC/"
          cd "$SRC"
          pnpm install --frozen-lockfile
          pnpm exec vitest run web/tests/gold-help.test.ts web/tests/i18n.test.ts web/tests/iphone-layout.test.ts
      - name: Ensure User UI compiles with three-language content
        run: |
          cd "$SRC"
          pnpm exec tsc --noEmit
