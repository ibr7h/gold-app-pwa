name: Inspect Gold App runtime wiring

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print runtime files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gold-runtime
          mkdir -p /tmp/gold-runtime
          unzip -q "gold-app 17 apr 15-19 adimin icon.zip" -d /tmp/gold-runtime
          ROOT="/tmp/gold-runtime/gold-app 17 apr 15-19 adimin icon"
          for f in constants/oauth.ts server/README.md lib/_core/api.ts lib/trpc.ts services/GoldApiService.ts hooks/useGoldPrice.ts; do
            echo "===== $f ====="
            cat "$ROOT/$f"
          done
