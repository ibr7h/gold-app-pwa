name: Verify live historical chart data
on:
  pull_request:
    branches: ["preview/iphone-render"]
    paths:
      - "apps/user/overrides/web/UserWorkspace.tsx"
      - "apps/user/overrides/web/PriceHistoryChart.tsx"
      - "apps/user/overrides/web/price-trend.ts"
      - "apps/user/overrides/web/price-status.ts"
      - "scripts/check-live-history.cjs"
      - "scripts/check-live-history.test.cjs"
      - ".github/workflows/check-history-live-endpoint.yml"
  push:
    branches: ["preview/iphone-render"]
    paths:
      - "scripts/check-live-history.cjs"
      - "scripts/check-live-history.test.cjs"
      - ".github/workflows/check-history-live-endpoint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Prove the history gate rejects missing and corrupted data
        run: node --test scripts/check-live-history.test.cjs
      - name: Verify real monthly coverage and separate live prices (SAR and USD)
        run: node scripts/check-live-history.cjs
