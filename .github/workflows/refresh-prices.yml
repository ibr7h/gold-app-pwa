name: Refresh live gold price

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

# Prevent competing scheduled refreshes from overwriting quote history.
concurrency:
  group: live-gold-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check global gold market trading session
        id: market
        shell: bash
        run: |
          set -euo pipefail
          # America/New_York + IANA DST; fail closed on invalid clock/time-zone.
          state="$(python3 scripts/gold_market_refresh.py market-state)"
          echo "open=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != "true" ]; then
            echo "Market closed: no provider request, no new historical records."
          fi

      - name: Fetch and store genuine open-market price
        if: steps.market.outputs.open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail --silent --show-error \
            "https://api.gold-api.com/price/XAU/USD" -o /tmp/gold.json
          # Recheck session and provider observation time after the HTTP call:
          # Never redate unchanged or closed-session values to the polling clock.
          python3 scripts/gold_market_refresh.py update /tmp/gold.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices-live.json prices-history.json
          if git diff --cached --quiet; then
            echo "No meaningful new supplier observation: price files unchanged."
            exit 0
          fi
          git commit -m "Update genuine open-market gold price history"
          git push
