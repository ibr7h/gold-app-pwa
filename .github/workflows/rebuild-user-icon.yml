name: Rebuild approved User icon

on:
  push:
    branches: ["ui/user-photo-icon-biometric"]
    paths:
      - "apps/user/assets/app_icon_user.b64.d/**"
      - ".github/workflows/rebuild-user-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/user-photo-icon-biometric
          fetch-depth: 0
      - name: Rebuild and verify exact JPG
        shell: bash
        run: |
          set -euo pipefail
          PARTS="apps/user/assets/app_icon_user.b64.d"
          OUT="apps/user/assets/app_icon_user.jpg"
          test -d "$PARTS"
          cat "$PARTS"/*.txt | tr -d '\n\r' | base64 --decode > "$OUT"
          test "$(wc -c < "$OUT" | tr -d ' ')" = "37404"
          echo "f2f51ca30080807e3d03fda2dacd964f06aeebe2d12fbf0c65120f56532543cd  $OUT" | sha256sum -c -
          file "$OUT" | grep -qi 'JPEG image data'
          rm -rf "$PARTS" apps/user/assets/.app_icon_parts
      - name: Commit exact icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/user/assets
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Store exact approved User JPG icon"
          git push origin HEAD:ui/user-photo-icon-biometric
