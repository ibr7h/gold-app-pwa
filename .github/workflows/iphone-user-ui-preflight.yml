name: iPhone User UI preflight
on:
  pull_request:
    branches: ["preview/iphone-render"]
    paths:
      - "apps/user/overrides/**"
      - "apps/user/scripts/**"
      - "gold-app 17 apr 15-19 adimin icon.zip"
      - ".github/workflows/build-iphone-wallet.yml"
      - ".github/workflows/iphone-user-ui-preflight.yml"
      - "scripts/iphone_static_assets.py"
      - "scripts/test_iphone_static_assets.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Extract User application source
        run: |
          unzip -q "gold-app 17 apr 15-19 adimin icon.zip" -d /tmp
          echo "SRC=/tmp/gold-app 17 apr 15-19 adimin icon" >> "$GITHUB_ENV"
      - name: Apply reviewed web compatibility patches
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os,subprocess,yaml
          cfg=yaml.safe_load(open('.github/workflows/deploy-pages.yml',encoding='utf-8'))
          steps=cfg['jobs']['deploy']['steps']
          script=next(step['run'] for step in steps if step.get('name')=='Apply web-only PWA compatibility patches')
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True,env=os.environ)
          PY
      - name: Apply User-only overrides
        run: |
          cp -R "$GITHUB_WORKSPACE/apps/user/overrides/." "$SRC/"
          cd "$SRC"
          for route in chat admin new-order new-client admin-stats admin-users trader-home order-detail admin-invites trader-orders admin-settings trader-clients trader-reports trader-location trader-messages admin-permissions trader-notifications; do
            find app -type f \( -name "$route.tsx" -o -name "$route.web.tsx" -o -name "$route.jsx" -o -name "$route.js" \) -delete
          done
      - name: Run iPhone User tests and static export
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_APP_VARIANT: "user"
        run: |
          cd "$SRC"
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec vitest run web/tests
          pnpm exec expo export --platform web --output-dir dist-pwa --clear
      - name: Test static-asset guard and verify the real release packaging
        run: |
          python3 -m unittest discover -s scripts -p 'test_iphone_static_assets.py'
          python3 - <<'PY'
          import os,subprocess,yaml
          cfg=yaml.safe_load(open('.github/workflows/build-iphone-wallet.yml',encoding='utf-8'))
          steps=cfg['jobs']['build']['steps']
          script=next(step['run'] for step in steps if step.get('name')=='Preserve preview PWA assets and replace compiled bundle')
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True,env=os.environ)
          PY
          node scripts/security-audit-iphone.cjs
          node --test apps/user/scripts/user-update.test.cjs apps/user/scripts/offline-assets.test.cjs
          node apps/user/scripts/offline-assets.cjs _render_preview/gold-app-pwa/full
      - name: Install isolated browser-test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dhahabk-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/dhahabk-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise real CSP and cold offline restart in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/dhahabk-browser/node_modules
        run: node apps/user/scripts/iphone-browser-smoke.cjs _render_preview/gold-app-pwa/full
