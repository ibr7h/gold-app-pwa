name: Build and version iPhone User preview
on:
  push:
    branches: ["preview/iphone-render"]
    paths:
      - "apps/user/overrides/**"
      - "apps/user/scripts/**"
      - ".github/workflows/build-iphone-wallet.yml"
      - "gold-app 17 apr 15-19 adimin icon.zip"
      - "scripts/security-audit-iphone.cjs"
      - "apps/user/scripts/user-update-client.js"
      - "apps/user/scripts/user-update-locales.js"
      - "apps/user/scripts/standalone-install-gate.js"
      - "apps/user/scripts/user-service-worker.js"
      - "apps/user/scripts/user-update.test.cjs"
      - "apps/user/scripts/test-iphone-purchase.cjs"
      - "scripts/release-iphone-version.cjs"
      - "scripts/check-iphone-release.cjs"
      - "scripts/iphone_static_assets.py"
      - "scripts/test_iphone_static_assets.py"
      - "apps/user/overrides/web/UserWorkspace.tsx"
      - "apps/user/overrides/web/GoldHelp.tsx"
      - "apps/user/overrides/web/gold-help-content.ts"
      - "apps/user/overrides/web/gold-help-facts.ts"
      - "apps/user/overrides/web/gold-help.css"
      - "apps/user/overrides/web/tests/gold-help.test.ts"
      - "apps/user/overrides/web/auth-device-language.ts"
      - "apps/user/overrides/web/AuthForm.tsx"
      - "apps/user/overrides/web/api.ts"
      - "apps/user/overrides/contexts/AuthContext.web.tsx"
      - "apps/user/overrides/web/push-client.ts"
      - "apps/user/overrides/web/session-vault.ts"
      - "apps/user/overrides/contexts/ApiKeyContext.tsx"
      - "apps/user/overrides/services/GoldApiService.ts"
      - "apps/user/overrides/web/local-biometric.ts"
      - "apps/user/overrides/web/tests/single-session-compatibility.test.ts"
      - "apps/user/overrides/web/tests/biometric-vault-recovery.test.ts"
      - "apps/user/overrides/web/tests/frontend-security.test.ts"
      - "apps/user/overrides/web/RegistrationPhoneField.tsx"
      - "apps/user/overrides/web/AuthLanguageSwitcher.tsx"
      - "apps/user/overrides/web/registration.css"
      - "apps/user/overrides/web/RegistrationLegalDocuments.tsx"
      - "apps/user/overrides/web/tests/registration.test.ts"
      - "apps/user/overrides/web/tests/auth-device-language.test.ts"
      - "apps/user/overrides/app/login.web.tsx"
      - "apps/user/overrides/app/register.web.tsx"
      - "apps/user/overrides/web/i18n.tsx"
      - "apps/user/overrides/web/i18n-messages.ts"
      - "apps/user/overrides/web/date-display.ts"
      - "apps/user/overrides/web/i18n-followup.ts"
      - "apps/user/overrides/web/tests/calendar-preferences.test.ts"
      - "apps/user/overrides/web/i18n-invoice-errors.ts"
      - "apps/user/overrides/web/i18n-feedback.ts"
      - "apps/user/overrides/web/QuickLockScreen.tsx"
      - "apps/user/overrides/web/UserPersonalDetails.tsx"
      - "apps/user/overrides/web/amount-words-localized.ts"
      - "apps/user/overrides/web/tests/i18n.test.ts"
      - "apps/user/overrides/web/price-display.tsx"
      - "apps/user/overrides/web/PriceHistoryChart.tsx"
      - "apps/user/overrides/web/NotificationSettings.tsx"
      - "apps/user/overrides/web/user.css"
      - "apps/user/overrides/web/display-currency.ts"
      - "apps/user/overrides/web/tests/display-currency.test.ts"
      - "apps/user/overrides/web/home-data.ts"
      - "apps/user/overrides/web/PurchaseFormFields.tsx"
      - "apps/user/overrides/web/NearbyMarkets.tsx"
      - "apps/user/overrides/web/nearby-geolocation.ts"
      - "apps/user/overrides/web/tests/nearby-geolocation.test.ts"
      - "apps/user/overrides/web/price-status.ts"
      - "apps/user/overrides/web/price-trend.ts"
      - "apps/user/overrides/web/tests/price-trend.test.ts"
      - "apps/user/overrides/web/arabic-amount-words.ts"
      - "apps/user/overrides/web/tests/arabic-amount-words.test.ts"
      - "apps/user/overrides/web/tests/price-status.test.ts"
      - "apps/user/overrides/web/tests/iphone-layout.test.ts"
      - "apps/user/overrides/web/tests/v1920-restore.test.ts"
      - "apps/user/overrides/web/tests/fixtures/v1.9.20-calculator.txt"
      - "apps/user/overrides/web/user.css"
  # Changes to this release workflow are versioned too, so Pages receives the latest iPhone bundle.
  workflow_dispatch:
permissions:
  contents: write
  actions: write # Dispatch the main-branch Pages publisher after the iPhone bundle is ready.
concurrency:
  group: build-iphone-wallet
  cancel-in-progress: false
jobs:
  build:
    if: "${{ !startsWith(github.event.head_commit.message, 'build(user-iphone): wallet-card') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Extract original source
        run: |
          unzip -q "gold-app 17 apr 15-19 adimin icon.zip" -d /tmp
          SRC="/tmp/gold-app 17 apr 15-19 adimin icon"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
      - name: Apply existing reviewed Expo compatibility patches
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os,subprocess,yaml
          cfg=yaml.safe_load(open('.github/workflows/deploy-pages.yml',encoding='utf-8'))
          scripts=cfg['jobs']['deploy']['steps']
          script=next(s['run'] for s in scripts if s.get('name')=='Apply web-only PWA compatibility patches')
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True,env=os.environ)
          PY
      - name: Apply latest User-only overrides
        run: |
          cp -R "$GITHUB_WORKSPACE/apps/user/overrides/." "$SRC/"
          cd "$SRC"
          for route in chat admin new-order new-client admin-stats admin-users trader-home order-detail admin-invites trader-orders admin-settings trader-clients trader-reports trader-location trader-messages admin-permissions trader-notifications; do
            find app -type f \( -name "$route.tsx" -o -name "$route.web.tsx" -o -name "$route.jsx" -o -name "$route.js" \) -delete
          done
          # Password/email authentication replaced this URL-token callback.
          # Dev-only pages must never be part of the User production export.
          rm -f app/oauth/callback.tsx app/oauth/callback.web.tsx \
            app/forgot-password.tsx app/forgot-password.web.tsx \
            app/dev/theme-lab.tsx app/dev/theme-lab.web.tsx
      - name: Sanitize the archived User source
        run: |
          rm -f "$SRC/tests/goldapi-key.test.ts" \
            "$SRC/tests/goldapi-public-key.test.ts" \
            "$SRC/goldapi-notes.txt"
          rm -f "$GITHUB_WORKSPACE/gold-app 17 apr 15-19 adimin icon.zip"
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/gold-app 17 apr 15-19 adimin icon.zip" \
            "$(basename "$SRC")"
      - name: Stamp upcoming User version in source before Expo compilation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          origin=Path('apps/user/overrides/web/app-version.ts').read_text()
          destination=Path(os.environ['SRC'])/'web/app-version.ts'
          current=destination.read_text()
          if current != origin:
              raise RuntimeError('Copied User version differs from release source')
          found=re.search(r"export const APP_VERSION = '([0-9]+)[.]([0-9]+)[.]([0-9]+)';", current)
          if not found:
              raise RuntimeError('No User semantic version in source')
          next_version=f"{found.group(1)}.{found.group(2)}.{int(found.group(3))+1}"
          destination.write_text(current[:found.start()] + f"export const APP_VERSION = '{next_version}';" + current[found.end():])
          print('Compiling real UI for next iPhone release v'+next_version)
          PY
      - name: Build current iPhone User
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_APP_VARIANT: "user"
        run: |
          cd "$SRC"
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          # Include the PIN/device-renewal/session-vault regressions on every release.
          pnpm exec vitest run web/tests
          pnpm exec expo export --platform web --output-dir dist-pwa --clear
      - name: Preserve preview PWA assets and replace compiled bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re,shutil
          from scripts.iphone_static_assets import refresh_css_links,verify_static_assets
          src=Path(os.environ['SRC'])/'dist-pwa'
          dest=Path('_render_preview/gold-app-pwa/full')
          entries=list((src/'_expo/static/js/web').glob('entry-*.js'))
          entries=[p for p in entries if re.fullmatch(r'entry-[0-9a-f]+\.js',p.name)]
          if len(entries)!=1:
              raise RuntimeError(f'Expected one newly exported entry bundle, found {entries}')
          bundle=entries[0]
          compiled=bundle.read_text()
          for marker in ('portfolio-card-actions','portfolio-change-value','portfolio-edit','home-chart-card','calc-estimate-card','weight-presets','calc-words-block','calc-words-value'):
              if marker not in compiled:
                  raise RuntimeError(f'New wallet code missing in compiled Expo bundle: {marker}')
          css_files=list((src/'_expo/static/css').glob('user-*.css'))
          fresh_css_names=[p.name for p in (src/'_expo/static/css').glob('*.css')]
          if len(css_files)!=1:
              raise RuntimeError(f'Expected one User stylesheet, got {css_files}')
          help_styles=list((src/'_expo/static/css').glob('gold-help-*.css'))
          if len(help_styles)!=1:
              raise RuntimeError(f'Expected one GoldHelp stylesheet, got {help_styles}')
          help_css=help_styles[0].name
          # Receipt Printer is an Expo CSS sidecar. It must be explicitly
          # linked like registration and GoldHelp; copying the file alone
          # rendered the receipt as overlapping unstyled text on iOS.
          receipt_styles=list((src/'_expo/static/css').glob('estimated-price-receipt-printer-*.css'))
          if len(receipt_styles)!=1:
              raise RuntimeError(f'Expected one receipt-printer stylesheet, got {receipt_styles}')
          receipt_css=receipt_styles[0].name
          for marker in ('.dh-estimate-printer-machine','.dh-estimate-printer-paper','@media(prefers-reduced-motion:reduce)'):
              if marker not in receipt_styles[0].read_text():
                  raise RuntimeError(f'Receipt printer stylesheet rule missing: {marker}')
          if '.dh-help-category' not in help_styles[0].read_text():
              raise RuntimeError('GoldHelp stylesheet is missing essential card styles')
          # Expo emits registration.css as a separate chunk that the generated
          # HTML does NOT link automatically. Missing link caused the broken
          # globe and hundreds of overlapping country rows on iPhone.
          signup_styles=list((src/'_expo/static/css').glob('registration-*.css'))
          if len(signup_styles)!=1:
              raise RuntimeError(f'Expected one registration stylesheet, got {signup_styles}')
          signup_css=signup_styles[0].name
          for marker in ('.dh-intl-country-option','.dh-auth-language-trigger','.dh-country-backdrop','.registration-consent','.registration-legal-dialog'):
              if marker not in signup_styles[0].read_text():
                  raise RuntimeError(f'Missing signup stylesheet rule: {marker}')
          signup_href='/gold-app-pwa/full/_expo/static/css/'+signup_css
          help_href='/gold-app-pwa/full/_expo/static/css/'+help_css
          receipt_href='/gold-app-pwa/full/_expo/static/css/'+receipt_css
          # Each deployment must contain only the new export. Historical bundles
          # previously left revoked secrets and outdated code publicly reachable.
          shutil.rmtree(dest/'_expo/static/js/web',ignore_errors=True)
          shutil.rmtree(dest/'_expo/static/css',ignore_errors=True)
          shutil.copytree(src/'_expo',dest/'_expo',dirs_exist_ok=True)
          for obsolete in ('oauth/callback.html','forgot-password.html','dev/theme-lab.html'):
              target=dest/obsolete
              if target.exists():
                  target.unlink()
          security_meta=(
              '<meta http-equiv="Content-Security-Policy" content="default-src \'self\'; '
              'script-src \'self\' \'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8=\'; '
              'style-src \'self\' \'unsafe-inline\'; img-src \'self\' data: blob:; '
              'font-src \'self\' data:; connect-src \'self\' https://gold-app-api-u8dl.onrender.com https://api.frankfurter.dev https://api.gold-api.com; '
              'worker-src \'self\' blob:; manifest-src \'self\'; object-src \'none\'; '
              'base-uri \'self\'; form-action \'self\'; upgrade-insecure-requests">'
              '<meta name="referrer" content="no-referrer">'
          )
          updated=0
          for page in dest.rglob('*.html'):
              html=page.read_text()
              next_html,n=re.subn(r'(?<=/web/)entry-(?:[0-9a-f]+|dhahabi-v[0-9.]+)\.js',bundle.name,html)
              # Update every retained Expo CSS chunk, not only user.css. In
              # particular, web.css changes hashes and iphone.css is now retired.
              next_html=refresh_css_links(next_html,fresh_css_names)
              # Expo exports GoldHelp as a separate CSS chunk; the User entry pages
              # do not link it automatically. Include the active, hashed stylesheet.
              next_html=re.sub(r'<link rel="stylesheet" href="/gold-app-pwa/full/_expo/static/css/gold-help-[a-f0-9]+\.css"\s*/?>','',next_html)
              next_html=re.sub(r'<link rel="stylesheet" href="/gold-app-pwa/full/_expo/static/css/registration-[a-f0-9]+\.css"\s*/?>','',next_html)
              next_html=re.sub(r'<link rel="stylesheet" href="/gold-app-pwa/full/_expo/static/css/estimated-price-receipt-printer-[a-f0-9]+\.css"\s*/?>','',next_html)
              next_html=re.sub(r'<meta http-equiv="Content-Security-Policy"[^>]*>','',next_html)
              next_html=re.sub(r'<meta name="referrer"[^>]*>','',next_html)
              if next_html.count('<head>')!=1:
                  raise RuntimeError(f'HTML head missing on {page}')
              next_html=next_html.replace('<head>','<head>'+security_meta,1)
              if n:
                  if next_html.count('</head>')!=1:
                      raise RuntimeError(f'HTML head missing on {page}')
                  next_html=next_html.replace('</head>',f'<link rel="stylesheet" href="{signup_href}"><link rel="stylesheet" href="{help_href}"><link rel="stylesheet" href="{receipt_href}"></head>',1)
                  page.write_text(next_html)
                  updated+=1
          if updated<25:
              raise RuntimeError(f'Only {updated} preview pages point to fresh wallet entry')
          for target in (dest/'index.html',dest/'faq-support.html',dest/'home.html'):
              if target.read_text().count(help_href)!=1:
                  raise RuntimeError(f'GoldHelp CSS is not linked by {target}')
          for target in (dest/'index.html',dest/'login.html',dest/'register.html'):
              if target.read_text().count(signup_href)!=1:
                  raise RuntimeError(f'Registration CSS is not linked by {target}')
          # Guard every route against an orphaned dynamic CSS import.
          for target in dest.rglob('*.html'):
              if target.read_text().count(receipt_href)!=1:
                  raise RuntimeError(f'Receipt Printer CSS is missing or duplicated in {target}')
          print(f'New User entry {bundle.name}, GoldHelp CSS {help_css}, updated {updated} preview pages')
          pages,assets=verify_static_assets(dest)
          print(f'PASS packaged User assets: {pages} pages, {assets} assets, zero broken references')
          PY
      - name: Block frontend secret leakage and unsafe legacy artifacts
        run: node scripts/security-audit-iphone.cjs
      - name: Publish localized iPhone updater on every preview page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          base=Path('_render_preview/gold-app-pwa/full')
          shutil.copy2('apps/user/scripts/user-update-locales.js',base/'user-update-locales.js')
          # The installation gate is generated from one reviewed User-only source.
          shutil.copy2('apps/user/scripts/standalone-install-gate.js',base/'standalone-install-gate.js')
          needle='<script src="/gold-app-pwa/full/pwa-update.js'
          injected=0
          for page in base.rglob('*.html'):
              text=page.read_text()
              if needle not in text:
                  continue
              if 'user-update-locales.js' not in text:
                  text=text.replace(needle,
                      '<script src="/gold-app-pwa/full/user-update-locales.js?v=0"></script>'+needle)
                  page.write_text(text)
              injected+=1
          if injected < 20:
              raise RuntimeError(f'Localized updater only present on {injected} preview routes')
          print(f'Localized update messages enabled on {injected} preview routes')
          PY
      - name: Verify PWA update activation and offline cache behavior
        run: node --test apps/user/scripts/user-update.test.cjs apps/user/scripts/offline-assets.test.cjs
      - name: Advance and verify iPhone release version
        run: |
          node scripts/release-iphone-version.cjs
          node scripts/check-iphone-release.cjs
          node apps/user/scripts/test-iphone-purchase.cjs
      - name: Reject missing assets in the final versioned release
        run: |
          python3 -m unittest discover -s scripts -p 'test_iphone_static_assets.py'
          python3 scripts/iphone_static_assets.py _render_preview/gold-app-pwa/full
      - name: Keep build on isolated iPhone branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _render_preview/gold-app-pwa/full apps/user/overrides/web/app-version.ts \
            "gold-app 17 apr 15-19 adimin icon.zip"
          git diff --cached --quiet && { echo "No compiled changes"; exit 1; }
          git commit -m "build(user-iphone): wallet-card Expo bundle"
          git push origin HEAD:preview/iphone-render
      # GitHub Pages is deployed only from main. The iPhone release is built on
      # preview/iphone-render, so without this explicit dispatch /iphone/ remains
      # on an old version and can never offer the latest update.
      - name: Publish approved iPhone preview to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
          echo "Requested main-branch Pages deployment with the updated /iphone/ bundle."
